name: Task
description: A unit of work for one agent session
title: "P<phase>-<n> <verb first>"
labels: []
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One or two sentences, verb first. What must change, not how.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Runnable checks. Anything only a device can prove is listed as "Joe verifies on device".
    validations:
      required: true
  - type: textarea
    id: route
    attributes:
      label: Route
      description: "agent (claude-local | claude-cloud | antigravity | jules | joe), model, effort, mode (plan | direct)"
      placeholder: "agent: claude-local   model: Sonnet 5.5   effort: medium   mode: plan"
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Issue ids (P0-1, #12) or "none"
      value: none
    validations:
      required: true
