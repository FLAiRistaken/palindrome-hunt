name: ci

# Required checks (branch protection uses these exact names):
#   lint, test (ubuntu-latest), test (macos-latest), test (windows-latest)
# Every one of these jobs always runs, so each reports under its real name. On docs-only PRs
# the `changes` job outputs code=false and every step of lint and test is skipped via a
# step-level `if:`, so the jobs finish in seconds, green. Never skip at job level: a job-level
# `if:` on the matrix job yields one skipped check literally named `test (${{ matrix.os }})`
# and the three real names stay pending forever. Never use a workflow-level `paths:` filter
# either: a skipped workflow leaves required checks pending forever.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Did anything other than docs change?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE"..."$HEAD")"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(docs/|README\.md$|CLAUDE\.md$|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$)' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      # rustup is preinstalled on GitHub runners and installs the toolchain pinned in
      # rust-toolchain.toml (with rustfmt and clippy) on first use.
      - run: rustup show
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - run: cargo fmt --check
        if: needs.changes.outputs.code == 'true'
      - run: cargo clippy --all-targets --release -- -D warnings
        if: needs.changes.outputs.code == 'true'

  test:
    name: test (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - run: rustup show
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - run: cargo test --release
        if: needs.changes.outputs.code == 'true'
      # Smoke run of the real binary: independent cross-check, a short search, then the
      # results must reproduce and the frontier must be exactly 80 bits with only the
      # trivial hits.
      - name: Smoke run
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/palhunt
          "$bin" brute --to-bits 20
          "$bin" search --to-bits 80 --state-dir ci-state
          "$bin" verify --sample 25 --state-dir ci-state
          "$bin" status --to-bits 80 --state-dir ci-state | tee status.txt
          grep -q "below 2^80 has been tested" status.txt
          grep -q "hits: 5 (0 non-trivial): 1, 3, 5, 7, 9" status.txt
